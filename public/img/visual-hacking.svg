<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#fondo)"/>
  <rect y="540" width="1200" height="135" fill="#172236"/>

  <!-- Oficina detrás del vidrio: escritorio y monitor con datos visibles -->
  <rect x="560" y="430" width="440" height="20" rx="6" fill="#64748b"/>
  <rect x="590" y="450" width="14" height="90" fill="#475569"/>
  <rect x="956" y="450" width="14" height="90" fill="#475569"/>
  <rect x="650" y="230" width="280" height="170" rx="8" fill="#0f2a4a" stroke="#475569" stroke-width="6"/>
  <rect x="780" y="400" width="20" height="30" fill="#475569"/>
  <g fill="#f8fafc">
    <rect x="675" y="255" width="140" height="12" rx="3" fill-opacity="0.85"/>
    <rect x="675" y="282" width="220" height="8" rx="3" fill-opacity="0.5"/>
    <rect x="675" y="300" width="190" height="8" rx="3" fill-opacity="0.5"/>
    <rect x="675" y="318" width="205" height="8" rx="3" fill-opacity="0.5"/>
  </g>
  <g fill="#22d3ee">
    <rect x="675" y="345" width="40" height="35" rx="3"/>
    <rect x="725" y="330" width="40" height="50" rx="3"/>
    <rect x="775" y="355" width="40" height="25" rx="3"/>
    <rect x="825" y="320" width="40" height="60" rx="3"/>
  </g>

  <!-- Pared de vidrio sin protección -->
  <rect x="480" y="70" width="640" height="470" fill="#22d3ee" fill-opacity="0.05" stroke="#f8fafc" stroke-opacity="0.35" stroke-width="3"/>
  <g stroke="#f8fafc" stroke-opacity="0.12" stroke-width="10" stroke-linecap="round">
    <line x1="530" y1="200" x2="610" y2="120"/>
    <line x1="1010" y1="230" x2="1080" y2="160"/>
  </g>

  <!-- Persona en el pasillo mirando -->
  <g fill="#64748b">
    <circle cx="260" cy="270" r="38"/>
    <path d="M190 540v-150c0-50 30-80 70-80s70 30 70 80v150z"/>
  </g>
  <!-- Línea de visión -->
  <path d="M300 265 L650 300" stroke="#22d3ee" stroke-width="3" stroke-dasharray="10 10" fill="none"/>
  <!-- Ojo -->
  <g transform="translate(395 180)">
    <path d="M-50 0c25-32 75-32 100 0c-25 32-75 32-100 0z" fill="none" stroke="#22d3ee" stroke-width="5"/>
    <circle r="14" fill="#22d3ee"/>
  </g>

  <text x="600" y="615" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#f8fafc" fill-opacity="0.85">Sin software ni rastro: solo hace falta mirar</text>
</svg>
