<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#fondo)"/>
  <line x1="600" y1="40" x2="600" y2="580" stroke="#f8fafc" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Izquierda: smart film activado (opaco total) -->
  <rect x="70" y="110" width="460" height="400" fill="#334155"/>
  <rect x="70" y="110" width="460" height="400" fill="#e2e8f0" fill-opacity="0.75" stroke="#f8fafc" stroke-opacity="0.5" stroke-width="3"/>
  <!-- Interruptor -->
  <rect x="455" y="280" width="34" height="60" rx="8" fill="#0b1220"/>
  <rect x="462" y="287" width="20" height="22" rx="4" fill="#22d3ee"/>

  <!-- Derecha: film de ocultación (transparente, pantalla negra) -->
  <rect x="670" y="410" width="460" height="16" rx="5" fill="#64748b"/>
  <g fill="#475569">
    <circle cx="760" cy="330" r="24"/>
    <path d="M718 410c0-44 18-62 42-62s42 18 42 62z"/>
    <circle cx="1040" cy="330" r="24"/>
    <path d="M998 410c0-44 18-62 42-62s42 18 42 62z"/>
  </g>
  <rect x="800" y="170" width="200" height="120" rx="6" fill="#000" stroke="#475569" stroke-width="5"/>
  <rect x="890" y="290" width="20" height="30" fill="#475569"/>
  <rect x="670" y="110" width="460" height="400" fill="#22d3ee" fill-opacity="0.06" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="3"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="300" y="80" font-size="16" font-weight="600" letter-spacing="1.5" fill="#94a3b8">SMART FILM (PDLC)</text>
    <text x="900" y="80" font-size="16" font-weight="600" letter-spacing="1.5" fill="#22d3ee">FILM DE OCULTACIÓN</text>
    <text x="300" y="560" font-size="22" fill="#f8fafc" fill-opacity="0.85">Oculta todo el ambiente</text>
    <text x="900" y="560" font-size="22" fill="#f8fafc" fill-opacity="0.85">Oculta solo las pantallas</text>
  </g>
</svg>
